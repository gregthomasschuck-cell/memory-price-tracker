name: Price pull

# Captures TrendForce's free DRAM and NAND spot and contract tables once a day
# and rebuilds the website. Re-running only adds tables that have updated since.
on:
  schedule:
    - cron: "17 11 * * *"   # 11:17 UTC daily (7:17 am New York in summer)
  push:                      # rebuild the site when the code, layout or history files change
    branches: [main]
    paths: [tracker.py, dashboard_template.html, "data/history_*.csv", data/outlook.json]
  workflow_dispatch:         # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: price-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Capture TrendForce price tables
        if: github.event_name != 'push'
        run: python tracker.py pull

      - name: Rebuild the website
        run: python tracker.py build --out docs

      - name: Save new prices and site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No new prices or site changes; nothing to commit."
            exit 0
          fi
          git commit -m "Prices: $(date -u +%Y-%m-%d)"
          git push
